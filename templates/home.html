
{% extends 'base.html' %}

{% block content %}

<h2>Available Products</h2>

<div class="container">

{% if products %}

    {% for p in products %}

        <div class="card">

            <p>Product ID: {{ p[0] }}</p>
            <h3>{{ p[1] }}</h3>
            <p>Price: ₹{{ p[2] }}</p>

            <a href="{{ url_for('product', id=p[0]) }}">
                View Details
            </a>

        </div>

    {% endfor %}

{% else %}

    <p>No products available.</p>

{% endif %}

</div>

{% endblock %}
