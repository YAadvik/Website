
{% extends 'base.html' %}

{% block content %}

<div class="card">

    <h2>Product Details</h2>

    <p>Product ID: {{ product[0] }}</p>
    <p>Product Name: {{ product[1] }}</p>
    <p>Price: ₹{{ product[2] }}</p>
    <p>Description: {{ product[3] }}</p>

    <a href="{{ url_for('order', id=product[0]) }}">
        Order Now
    </a>

</div>

{% endblock %}
